<svg xmlns="http://www.w3.org/2000/svg" width="400" height="120" viewBox="0 0 400 120">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#000000" />
    </linearGradient>
    <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0a66c2" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="396" height="116" x="2" y="2" rx="12" fill="url(#bg-grad)" stroke="url(#border-grad)" stroke-width="2" />
  
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <path d="M 0 30 L 400 30 M 0 60 L 400 60 M 0 90 L 400 90" />
    <path d="M 50 0 L 50 120 M 100 0 L 100 120 M 150 0 L 150 120 M 200 0 L 200 120 M 250 0 L 250 120 M 300 0 L 300 120 M 350 0 L 350 120" />
  </g>

  <rect x="12" y="2" width="80" height="2" fill="#60a5fa" filter="url(#neon-glow)" />

  <!-- Authentic LinkedIn Logo -->
  <g transform="translate(50, 60)">
    <rect x="-24" y="-24" width="48" height="48" rx="6" fill="#0a66c2" filter="url(#neon-glow)" />
    <text x="0" y="8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="32" font-weight="bold" fill="#ffffff" text-anchor="middle">in</text>
  </g>

  <!-- Centered Text exactly matching portfolio layout -->
  <text x="215" y="48" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="bold" fill="#ffffff" letter-spacing="0.5">LinkedIn</text>
  <text x="215" y="73" text-anchor="middle" font-family="monospace" font-size="12" fill="#60a5fa" filter="url(#neon-glow)" letter-spacing="0.5">&lt;Professional Network/&gt;</text>
  <text x="215" y="95" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" fill="#a1a1aa">Connect · Collaborate · Open Source</text>

  <g transform="translate(345, 60)" opacity="0.85">
    <rect x="0" y="-12" width="4" height="24" rx="2" fill="#0a66c2" filter="url(#neon-glow)"/>
    <rect x="8" y="-20" width="4" height="40" rx="2" fill="#60a5fa" filter="url(#neon-glow)"/>
    <rect x="16" y="-8" width="4" height="16" rx="2" fill="#3b82f6" opacity="0.8"/>
    <rect x="24" y="-15" width="4" height="30" rx="2" fill="#2563eb" opacity="0.6"/>
  </g>
</svg>
