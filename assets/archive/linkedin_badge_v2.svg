<svg xmlns="http://www.w3.org/2000/svg" width="400" height="120" viewBox="0 0 400 120">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>
    <linearGradient id="border-grad-light" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0a66c2" />
      <stop offset="100%" stop-color="#004182" />
    </linearGradient>
  </defs>

  <!-- Main Background Container -->
  <rect width="396" height="116" x="2" y="2" rx="12" fill="url(#bg-grad-light)" stroke="url(#border-grad-light)" stroke-width="2" />
  
  <!-- Subtle Tech Grid -->
  <g stroke="#0a66c2" stroke-opacity="0.08" stroke-width="1">
    <path d="M 0 30 L 400 30 M 0 60 L 400 60 M 0 90 L 400 90" />
    <path d="M 50 0 L 50 120 M 100 0 L 100 120 M 150 0 L 150 120 M 200 0 L 200 120 M 250 0 L 250 120 M 300 0 L 300 120 M 350 0 L 350 120" />
  </g>

  <!-- Top Line Accent -->
  <rect x="12" y="2" width="80" height="3" fill="#0a66c2" />

  <!-- LinkedIn "in" Icon Area -->
  <g transform="translate(45, 60)">
    <!-- Solid Blue LinkedIn Square -->
    <rect x="-22" y="-22" width="44" height="44" rx="6" fill="#0a66c2" />
    
    <!-- "in" logo text -->
    <text x="0" y="7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle">in</text>
  </g>

  <!-- Text Content -->
  <text x="215" y="48" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="900" fill="#0a66c2" letter-spacing="0.5">LinkedIn Profile</text>
  
  <text x="215" y="73" text-anchor="middle" font-family="monospace" font-size="12" fill="#333333" letter-spacing="0.5">&lt;Professional Network/&gt;</text>
  
  <text x="215" y="95" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#64748b">Connect · Collaborate · Open Source</text>

  <!-- Decorative Activity Bars (Right Side) -->
  <g transform="translate(345, 60)" opacity="0.9">
    <rect x="0" y="-12" width="4" height="24" rx="2" fill="#0a66c2" />
    <rect x="8" y="-20" width="4" height="40" rx="2" fill="#004182" />
    <rect x="16" y="-8" width="4" height="16" rx="2" fill="#0a66c2" opacity="0.7"/>
    <rect x="24" y="-15" width="4" height="30" rx="2" fill="#004182" opacity="0.5"/>
  </g>
</svg>
